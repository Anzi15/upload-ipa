name: Upload IPA to App Store

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Download IPA from Google Drive
        run: |
          pip3 install gdown
          gdown "https://drive.google.com/uc?id=10Lh2sIzNzB5YL3Xrf9mzwcfaHcfeFO_y" -O App.ipa
          ls -lh App.ipa

      - name: Upload IPA to App Store Connect
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file App.ipa \
            --username "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_PASSWORD }}" \
            --asc-provider "${{ secrets.APPLE_TEAM_ID }}"
