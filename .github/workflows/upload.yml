name: Upload IPA to App Store

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Download IPA from Google Drive
        run: |
         pip3 install gdown --break-system-packages
          gdown "https://drive.google.com/file/d/1mvZxzIGoXyBTiWC5UfuM8Q5oKJRhAyF0" -O App.ipa
          ls -lh App.ipa

      - name: Upload IPA to App Store Connect
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file App.ipa \
            --username "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_PASSWORD }}" \
            --asc-provider "${{ secrets.APPLE_TEAM_ID }}"
